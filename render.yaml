services:
  - type: web
    name: the-dating-app-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: daphne config.asgi:application --port $PORT --bind 0.0.0.0
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: the-dating-app-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://the-dating-app-demo.vercel.app,https://front-end-red-sigma.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: FRONTEND_URL
        value: https://the-dating-app-demo.vercel.app
      - key: FRONTEND_HOME_URL
        value: https://the-dating-app-demo.vercel.app/home
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
